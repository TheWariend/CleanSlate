name: CleanSlate Release
run-name: CleanSlate Release${{ inputs.skip_ci && ' (CI bypass)' || '' }}

on:
  # Bumping VERSION and pushing the "CleanSlate Release" commit starts the build.
  # The paths filter means ordinary pushes to main never create a run.
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the leading v (e.g. 1.0.1). Defaults to the VERSION file.
        required: false
      target:
        description: Which platform to build
        required: true
        type: choice
        default: macos
        options:
          # - windows
          - macos
          # - all
      skip_ci:
        description: Bypass the separate CI regression gate for this manual release
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time. Two pushes in quick succession must not race to
# publish the same tag.
concurrency:
  group: cleanslate-release
  cancel-in-progress: false

env:
  VSCODE_QUALITY: stable
  CLEANSLATE_RELEASE_DIR: .build/cleanslate-release
  RELEASES_REPOSITORY: TheWariend/CleanSlate-Releases
  BUILD_SOURCEVERSION: ${{ github.sha }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  ci:
    name: Validate before release
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  build-macos:
    name: Build macOS app
    needs: ci
    if: ${{ always() && !cancelled() && (needs.ci.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_ci)) && (github.event_name != 'workflow_dispatch' || inputs.target == 'macos' || inputs.target == 'all') }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: vscode-fork
    steps:
      - uses: actions/checkout@v4

      # The release version comes from the VERSION file, and everything
      # downstream reads these outputs.
      - name: Resolve version
        id: version
        working-directory: ${{ github.workspace }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-$(tr -d '[:space:]' < VERSION)}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, got '$version'."
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Bump VERSION."
            exit 1
          fi
          # Versions must move forward. `sort -V` puts the greater version last.
          latest="$(gh release view --repo "$RELEASES_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$latest" ]; then
            highest="$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n1)"
            if [ "$highest" != "$version" ] || [ "${latest#v}" = "$version" ]; then
              echo "::error::$version is not higher than the latest release ($latest)."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Building $tag."

      - uses: actions/setup-node@v4
        with:
          node-version-file: vscode-fork/.nvmrc
          cache: npm
          cache-dependency-path: vscode-fork/package-lock.json

      - name: Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci

      - name: Build CleanSlate SDK
        working-directory: ${{ github.workspace }}/packages/cleanslate-sdk
        run: |
          npm ci
          npm run build

      - name: Verify workbench Trusted Types policy
        run: node build/cleanslate/test/verify-workbench-trusted-types.mjs

      - name: Download built-in extensions
        run: npm run download-builtin-extensions

      - name: Build CleanSlate for macOS
        env:
          VSCODE_ARCH: arm64
        run: npm run gulp -- vscode-darwin-arm64

      - name: Smoke test packaged macOS app
        run: node build/cleanslate/test/smoke-packaged-app.mjs --app "$GITHUB_WORKSPACE/VSCode-darwin-arm64/CleanSlate.app"

      # Signing is temporarily disabled while the Apple Developer account is renewed.

      - name: Stage macOS artifacts
        env:
          VSCODE_ARCH: arm64
        run: |
          set -euo pipefail
          mkdir -p "$CLEANSLATE_RELEASE_DIR"
          ditto -c -k --sequesterRsrc --keepParent "$GITHUB_WORKSPACE/VSCode-darwin-arm64/CleanSlate.app" "$CLEANSLATE_RELEASE_DIR/CleanSlate-darwin-arm64.zip"
          node build/darwin/create-dmg.ts "$GITHUB_WORKSPACE" "$CLEANSLATE_RELEASE_DIR"
          mv "$CLEANSLATE_RELEASE_DIR/VSCode-darwin-arm64.dmg" "$CLEANSLATE_RELEASE_DIR/CleanSlate-darwin-arm64.dmg"

      - name: Create update manifest
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          release_version="$RELEASE_VERSION"
          asset_base_url="https://github.com/${RELEASES_REPOSITORY}/releases/download/${tag}/"
          node build/cleanslate/update/create-update-manifest.mjs \
            --artifacts "$CLEANSLATE_RELEASE_DIR" \
            --out "$CLEANSLATE_RELEASE_DIR/cleanslate-update.json" \
            --repository "$RELEASES_REPOSITORY" \
            --version "$release_version" \
            --assetBaseUrl "$asset_base_url" \
            --strict true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set RELEASES_REPO_TOKEN with Contents read/write access to ${RELEASES_REPOSITORY}."
            exit 1
          fi
          tag="$RELEASE_TAG"
          if gh release view "$tag" --repo "$RELEASES_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$CLEANSLATE_RELEASE_DIR"/* --repo "$RELEASES_REPOSITORY" --clobber
          else
            gh release create "$tag" "$CLEANSLATE_RELEASE_DIR"/* --repo "$RELEASES_REPOSITORY" --title "CleanSlate $tag" --notes "CleanSlate desktop release for Apple Silicon (arm64). This build is unsigned and not notarized while our Apple Developer account is being renewed. macOS Gatekeeper may block opening it; signed automatic upgrades may also reject it."
          fi

      # Tag last, so a failed build leaves no tag behind and the same version
      # can be retried by pushing a fix.
      - name: Tag the release
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "CleanSlate Bot"
          git config user.email "bot@thewariend.com"
          git tag -a "$RELEASE_TAG" -m "CleanSlate $RELEASE_VERSION"
          git push origin "$RELEASE_TAG"

      - name: Publish source release entry
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="Download the unsigned, unnotarized Apple Silicon macOS build from https://github.com/${RELEASES_REPOSITORY}/releases/tag/${RELEASE_TAG}."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest --title "CleanSlate $RELEASE_VERSION" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest --title "CleanSlate $RELEASE_VERSION" --notes "$notes"
          fi

